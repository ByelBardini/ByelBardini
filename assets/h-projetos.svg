<svg xmlns="http://www.w3.org/2000/svg" width="880" height="64" viewBox="0 0 880 64" role="img" aria-labelledby="hTitle">
<title id="hTitle">PROJETOS EM DESTAQUE</title>
<style><![CDATA[
@font-face {
  font-family: 'Orbitron';
  font-style: normal;
  font-weight: 700;
  src: url(data:font/woff2;base64,) format('woff2');
}
.t { font-family: 'Orbitron', 'Segoe UI', monospace; font-weight: 700; }
@keyframes flick { 0% { opacity: 0; } 8% { opacity: .9; } 14% { opacity: .25; } 22% { opacity: 1; } 30% { opacity: .5; } 42% { opacity: 1; } 100% { opacity: 1; } }
.title-in { animation: flick 1s ease-out backwards; }
@media (prefers-reduced-motion: reduce) { .title-in { animation: none; } }
]]></style>
<defs>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FF00FF"/>
    <stop offset="1" stop-color="#00FFFF"/>
  </linearGradient>
  <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FF00FF" stop-opacity="0"/>
    <stop offset=".3" stop-color="#FF00FF" stop-opacity="1"/>
    <stop offset=".7" stop-color="#00FFFF" stop-opacity="1"/>
    <stop offset="1" stop-color="#00FFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="titleGlow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b1"/>
    <feGaussianBlur stdDeviation="1.4" result="b2"/>
    <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<g class="title-in">
  <text class="t" x="440" y="36" font-size="26" letter-spacing="6" text-anchor="middle" fill="url(#titleGrad)" filter="url(#titleGlow)" paint-order="stroke" stroke="#08001A" stroke-width="5" stroke-linejoin="round">PROJETOS EM DESTAQUE</text>
</g>
<rect x="185" y="48" width="510" height="2" rx="1" fill="url(#lineGrad)" filter="url(#glow)">
  <animate attributeName="opacity" values="1;.55;1" dur="3s" repeatCount="indefinite"/>
</rect>
</svg>
