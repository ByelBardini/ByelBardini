name: Update Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare output dir
        run: mkdir -p dist

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=radical&hide_border=true&count_private=true&title_color=FF00FF&icon_color=00FFFF&text_color=FFFFFF&bg_color=0,000000,0C0032"
          path: dist/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@f9d8133845f40d659a754f78b8484983ba766448 # v2.0.1
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=radical&hide_border=true&title_color=FF00FF&text_color=00FFFF&bg_color=0,000000,0C0032"
          path: dist/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Publish to cards branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: cards
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
